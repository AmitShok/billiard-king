html/head_include="<style>/* Pin the page and canvas to the visible screen. iPhones grow an iframe to fit its content, which made the canvas larger than itch.io's frame and cut it off. */html,body{position:fixed;top:0;left:0;width:100%;height:100%;overflow:hidden;}#canvas{position:fixed !important;top:0 !important;left:0 !important;image-rendering:crisp-edges;image-rendering:pixelated;}</style><script>/* Phones: the first tap goes fullscreen and turns the game to landscape (browsers only allow an orientation lock in fullscreen). */(function(){var touch=(navigator.maxTouchPoints||0)>0&&window.matchMedia&&matchMedia('(pointer: coarse)').matches;if(!touch)return;function lock(){try{if(screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}}catch(e){}}function go(e){if(e.pointerType&&e.pointerType!=='touch')return;var d=document,el=d.documentElement;if(d.fullscreenElement||d.webkitFullscreenElement){lock();return;}var req=el.requestFullscreen||el.webkitRequestFullscreen;if(!req)return;try{var p=req.call(el,{navigationUI:'hide'});if(p&&p.then){p.then(lock).catch(function(){});}else{lock();}}catch(err){}}window.addEventListener('pointerup',go,true);})();</script><script>/* Size diagnostics: add ?debug to the address, or tap the top-left corner three times quickly. */(function(){var box=null,taps=[];function r(n){return Math.round(n*10)/10;}function show(){if(box){box.remove();box=null;return;}box=document.createElement('pre');box.style.cssText='position:fixed;left:4px;top:4px;z-index:99999;margin:0;padding:6px 8px;background:rgba(0,0,0,0.8);color:#9ff0b4;font:12px/1.35 monospace;pointer-events:none;white-space:pre';document.body.appendChild(box);tick();}function tick(){if(!box)return;var c=document.getElementById('canvas'),de=document.documentElement,vv=window.visualViewport,cr=c?c.getBoundingClientRect():null;box.textContent=['inner '+innerWidth+' x '+innerHeight,'client '+de.clientWidth+' x '+de.clientHeight,'scroll '+de.scrollWidth+' x '+de.scrollHeight,'visual '+(vv?r(vv.width)+' x '+r(vv.height)+' scale '+r(vv.scale):'none'),'screen '+screen.width+' x '+screen.height+' dpr '+devicePixelRatio,'canvas '+(c?c.width+' x '+c.height:'none'),'canvas css '+(c?c.style.width+' x '+c.style.height:''),'canvas box '+(cr?r(cr.left)+','+r(cr.top)+' '+r(cr.width)+' x '+r(cr.height):''),'framed '+(window.top!==window.self)+'  touch '+(navigator.maxTouchPoints||0),(navigator.userAgent.match(/(iPhone|iPad|Android)[^;)]*/)||['desktop'])[0]+(/CriOS/.test(navigator.userAgent)?' Chrome':'')].join(String.fromCharCode(10));setTimeout(tick,500);}window.addEventListener('pointerdown',function(e){if(e.clientX>70||e.clientY>70)return;var now=Date.now();taps=taps.filter(function(t){return now-t<1500;});taps.push(now);if(taps.length>=3){taps=[];show();}},true);window.addEventListener('load',function(){if(/debug/.test(location.search))show();});})();</script>"
